name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Build web assets
        run: |
          npm install
          npm run build

      - name: Install Capacitor iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Archive
        run: |
          cd ios/App
          xcodebuild clean archive -workspace App.xcworkspace -scheme App -archivePath App.archive -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO